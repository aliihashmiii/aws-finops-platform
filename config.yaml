# Cloud FinOps Control Plane configuration
# Credentials are intentionally not stored here. Use AWS credential chain, kubeconfig,
# service-account credentials, and provider-specific environment variables.
aws:
  default_region: us-east-1
  regions:
    - us-east-1
    - us-west-2
  profile: default

analysis:
  idle_cpu_threshold: 5.0
  idle_days: 7
  old_snapshot_days: 90
  snapshot_retention: 30

governance:
  required_tags:
    - Environment
    - Team
    - CostCenter
  kubernetes_require_requests: true
  kubernetes_require_limits: true
  ai_require_application_metadata: true

tagging:
  required_tags:
    - Environment
    - Team
    - CostCenter
    - Project
  enforce: true
  valid_environments:
    - production
    - staging
    - development
    - qa

forecast:
  horizon_months: 6
  growth_rate: 0.05

kubernetes:
  cpu_efficiency_threshold: 0.40
  memory_efficiency_threshold: 0.50
  node_utilization_threshold: 0.30
  safety_margin: 0.20

ai_finops:
  monthly_budget: 5000
  alert_threshold: 80
  high_cost_request: 0.10
  optimization_sensitivity: medium

application:
  mode: demo
  region: us-east-1
  kubernetes_cluster: finops-demo
  ai_provider: normalized-telemetry

budgets:
  engineering: 20000
  data_science: 18000
  infrastructure: 8000
  total: 50000

reporting:
  default_format: text
  auto_save: true
  output_dir: ./reports
  detailed: true

optimization:
  recommend_ri: true
  recommend_sp: true
  min_savings_threshold: 10.0
  risk_profile: moderate

notifications:
  slack:
    enabled: false
    webhook_url: ""
    channel: "#finops"
  email:
    enabled: false
    smtp_server: ""
    from_address: ""
    to_addresses: []

advanced:
  ml_forecasting: false
  anomaly_detection: true
  multi_account: false
