[project]
name = "cloud-finops-control-plane"
version = "2.1.0"
description = "AWS, Kubernetes, and AI FinOps visibility and optimization control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "boto3>=1.34.0",
  "botocore>=1.34.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0.1",
]

[tool.vercel]
entrypoint = "main:app"
